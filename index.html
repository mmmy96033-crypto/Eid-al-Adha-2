  <script>
function start(){

let name = document.getElementById("nameInput").value;
if(name === "") return;

/* نوع المستخدم */
let gender = document.querySelector('input[name="gender"]:checked').value;

/* تشغيل الموسيقى */
let music = document.getElementById("music");
music.play();

/* تحميل */
document.getElementById("startScreen").classList.remove("active");
document.getElementById("loadingScreen").classList.add("active");

setTimeout(()=>{

document.getElementById("loadingScreen").classList.remove("active");
document.getElementById("homeScreen").classList.add("active");

/* تكبيرات */
music.src = "fy.mp3";
music.loop = true;
music.play();

/* اسم */
document.getElementById("welcome").innerText =
"  " + name + " ";

/* رسالة حسب النوع */
let message = "";

if(gender === "boy"){
message = "ڪـل سنة وانت طيب يا " + name + " ربنا يجعله عيد فرح وسعادة عليك وعلى قلبك ويحقق لك فيه ڪل اللي تتمناه ويڪتب لك أيام أجمل من اللي فاتت يارب يڪون العيد ده بداية خير جديد ليك وتفضل دايمًا بخير وراحة بال ونجاح في ڪل خطواتك وڪل سنة وانت طيب وربنا يديم عليك الضحڪة والفرحة 🤍\nصلّوا على النبي ﷺ 🌿 ";
}else{
message = "ڪـل سنة وانتي طيبة يا " + name + "  عيد سعيد عليڪي يا جميلة ربنا يخلي أيامك ڪلها فرح وراحة بال ويحقق لكِ ڪل اللي بتتمناه ويڪتب لكِ بداية أجمل في ڪل حاجة جاية في حياتك إن شاء الله يڪون العيد ده مليان سعادة وضحك وطمأنينة لقلبك وتفضلي دايمًا بخير وفي أحسن حال ڪـل سنة وإنتِ طيبة وعيدك مبارك 🌸\n صلّوا على النبي ﷺ 🌿   ";
}

document.getElementById("message").innerText = message;

/* خرفان */
startSheepRain();

},24000);

}

function startSheepRain(){

const container = document.getElementById("sheepRain");

setInterval(()=>{

let sheep = document.createElement("div");
sheep.classList.add("sheep");

/* لو عندك صورة PNG تقدر تبدلها هنا */
sheep.innerHTML = "🐑";

sheep.style.left = Math.random() * 100 + "vw";

/* سرعة مختلفة لكل واحد */
sheep.style.animationDuration = (4 + Math.random() * 4) + "s";

/* حجم مختلف */
sheep.style.fontSize = (14 + Math.random() * 26) + "px";

/* تأخير بسيط عشان يبقوا طبيعيين */
sheep.style.opacity = Math.random() * 0.8 + 0.2;

container.appendChild(sheep);

/* حذف بعد الانتهاء */
setTimeout(()=>sheep.remove(),8000);

},300); // كثافة الخرفان

}

/* ==== إضافة: عداد زوار الموقع (Supabase) ==== */

const SUPABASE_URL = "https://mlujsnxdxafrfzykqzlh.supabase.co";
const SUPABASE_KEY = "sb_publishable_hWkdonF5Y3kQQNaOMdMLqw_96kTdZpp";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function updateVisitorCount(){
  try{
    let { data, error } = await supabaseClient
      .from('site_visits')
      .select('count')
      .eq('id', 1)
      .single();

    if(error) throw error;

    const newCount = (data.count || 0) + 1;

    const { error: updateError } = await supabaseClient
      .from('site_visits')
      .update({ count: newCount })
      .eq('id', 1);

    if(updateError) throw updateError;

    document.getElementById('visitor-count').textContent = newCount;

  } catch(err){
    /* هنعرض الخطأ نفسه بدل النقط عشان نشخص المشكلة */
    document.getElementById('visitor-count').textContent =
      'خطأ: ' + (err.message || JSON.stringify(err));
  }
}

/* تشغيل العداد أول ما الصفحة تفتح */
updateVisitorCount();
