/* ==== إضافة: عداد زوار الموقع (Supabase) - نسخة الجدول الفريد ==== */

async function updateVisitorCount(){

  const counterEl = document.getElementById('visitor-count');

  try{

    if(!window.supabase){
      counterEl.textContent = "مكتبة Supabase مش محملة";
      return;
    }

    const supabaseClient = window.supabase.createClient(
      "https://mlujsnxdxafrfzykqzlh.supabase.co",
      "sb_publishable_hWkdonF5Y3kQQNaOMdMLqw_96kTdZpp"
    );

    let visitorId = localStorage.getItem('visitorId');
    if(!visitorId){
      visitorId = 'v_' + Date.now() + '_' + Math.random().toString(36).substring(2, 12);
      localStorage.setItem('visitorId', visitorId);
    }

    await supabaseClient
      .from('unique_visitors')
      .insert({ visitor_id: visitorId });

    const { count, error: countError } = await supabaseClient
      .from('unique_visitors')
      .select('*', { count: 'exact', head: true });

    if(countError) throw countError;

    counterEl.textContent = count;

  } catch(err){
    counterEl.textContent = 'خطأ: ' + (err.message || JSON.stringify(err));
    console.error('تفاصيل الخطأ الكامل:', err);
  }
}

updateVisitorCount();

const commentsSupabase = window.supabase.createClient(
  "https://mlujsnxdxafrfzykqzlh.supabase.co",
  "sb_publishable_hWkdonF5Y3kQQNaOMdMLqw_96kTdZpp"
);

let commentsCache = [];
let repliesCache = [];
let expandedComments = new Set();

/* --- فتح وقفل النافذة --- */
function openComments(){
  document.getElementById('comments-modal').style.display = 'flex';
  loadComments();
  markCommentsAsSeen();
}

function closeComments(){
  document.getElementById('comments-modal').style.display = 'none';
}

document.getElementById('comments-icon-box').addEventListener('click', openComments);

/* --- تفعيل/إلغاء وضع المجهول لأي صندوق (رئيسي أو رد) --- */
function toggleAnonScope(nameInputId, checkboxId){
  const nameInput = document.getElementById(nameInputId);
  const isAnon = document.getElementById(checkboxId).checked;
  nameInput.disabled = isAnon;
  nameInput.style.opacity = isAnon ? 0.4 : 1;
}

/* --- حساب الوقت "منذ..." --- */
function timeAgo(dateStr){
  const diff = Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000);
  if(diff < 60) return "الآن";
  if(diff < 3600) return Math.floor(diff/60) + " د";
  if(diff < 86400) return Math.floor(diff/3600) + " س";
  return Math.floor(diff/86400) + " يوم";
}

/* --- منع أكواد HTML ضارة --- */
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* --- تحميل البيانات من القاعدة --- */
async function loadComments(){
  const listEl = document.getElementById('comments-list');

  try{
    const { data: comments, error: cErr } = await commentsSupabase
      .from('comments')
      .select('*')
      .order('created_at', { ascending: false });

    if(cErr) throw cErr;

    const { data: replies, error: rErr } = await commentsSupabase
      .from('comment_replies')
      .select('*')
      .order('created_at', { ascending: true });

    if(rErr) throw rErr;

    commentsCache = comments || [];
    repliesCache = replies || [];

    renderCommentsList();

  } catch(err){
    listEl.innerHTML = '<p style="color:#f87171; text-align:center;">خطأ: ' + (err.message || JSON.stringify(err)) + '</p>';
  }
}

/* --- عرض التعليقات من الكاش (بدون إعادة تحميل) --- */
function renderCommentsList(){
  const listEl = document.getElementById('comments-list');

  if(commentsCache.length === 0){
    listEl.innerHTML = '<p style="color:#9aa3c7; text-align:center; margin-top:20px;">لسه مفيش تعليقات، كن أول من يعلق 🌙</p>';
    return;
  }

  listEl.innerHTML = commentsCache.map(c => renderComment(c)).join('');
}

function renderComment(c){
  const myReplies = repliesCache.filter(r => r.comment_id === c.id);
  const expanded = expandedComments.has(c.id);
  const visibleReplies = expanded ? myReplies : myReplies.slice(0, 2);
  const hiddenCount = myReplies.length - visibleReplies.length;

  const repliesHtml = visibleReplies.map(r => renderReply(r, c.id)).join('');

  let moreBtn = '';
  if(hiddenCount > 0){
    moreBtn = `<button class="cmt-showmore-btn" onclick="toggleShowMore(${c.id})">عرض ${hiddenCount} رد إضافي</button>`;
  } else if(expanded && myReplies.length > 2){
    moreBtn = `<button class="cmt-showmore-btn" onclick="toggleShowMore(${c.id})">إخفاء الردود</button>`;
  }

  return `
    <div class="cmt-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="color:#fff; font-weight:700; font-size:14px;">${escapeHtml(c.name)}</span>
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="color:#6b7399; font-size:12px;">${timeAgo(c.created_at)}</span>
          <button class="cmt-delete-btn" onclick="deleteComment(${c.id})" title="حذف">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m5 0V4a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </div>
      </div>
      <p style="color:#e5e7ff; margin:6px 0; font-size:14px;">${escapeHtml(c.message)}</p>
      <button class="cmt-action-btn" onclick="openReplyBox(${c.id})">↩ رد</button>

      <div id="reply-box-${c.id}" class="cmt-reply-box">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
          <input type="text" id="reply-name-${c.id}" placeholder="اسمك" style="
            flex:1; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15);
            color:#fff; padding:8px 12px; border-radius:10px; font-family:'Cairo', sans-serif; font-size:13px;
          ">
          <label class="cmt-anon-toggle">
            <input type="checkbox" id="reply-anon-${c.id}" onchange="toggleAnonScope('reply-name-${c.id}','reply-anon-${c.id}')">
            <span class="slider"></span>
            مجهول
          </label>
        </div>
        <div style="display:flex; gap:6px;">
          <input type="text" id="reply-input-${c.id}" placeholder="اكتب ردك..." style="
            flex:1; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15);
            color:#fff; padding:8px 12px; border-radius:10px; font-family:'Cairo', sans-serif; font-size:13px;
          ">
          <button onclick="submitReply(${c.id})" style="
            background:linear-gradient(90deg,#5b6ef5,#7b5bf5); border:none; color:#fff;
            padding:0 14px; border-radius:10px; cursor:pointer; font-size:13px; font-family:'Cairo', sans-serif;
          ">إرسال</button>
        </div>
      </div>

      ${repliesHtml}
      ${moreBtn}
    </div>
  `;
}

function renderReply(r, parentCommentId){
  return `
    <div class="cmt-reply-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="color:#a5b4fc; font-weight:700; font-size:13px;">${escapeHtml(r.name)}</span>
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="color:#6b7399; font-size:11px;">${timeAgo(r.created_at)}</span>
          <button class="cmt-delete-btn" onclick="deleteReply(${r.id}, ${parentCommentId})" title="حذف">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m5 0V4a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </div>
      </div>
      <p style="color:#e5e7ff; margin:4px 0 0; font-size:13px;">${escapeHtml(r.message)}</p>
      <button class="cmt-action-btn" style="margin-top:4px;" onclick="openReplyBox(${parentCommentId}, '${escapeHtml(r.name).replace(/'/g,"")}')">↩ رد</button>
    </div>
  `;
}

/* --- إظهار/تعديل صندوق الرد --- */
function openReplyBox(commentId, mentionName){
  const box = document.getElementById('reply-box-' + commentId);
  const input = document.getElementById('reply-input-' + commentId);

  box.style.display = 'block';

  if(mentionName){
    input.value = '@' + mentionName + ' ';
  }

  input.focus();
}

/* --- إظهار/إخفاء المزيد من الردود --- */
function toggleShowMore(commentId){
  if(expandedComments.has(commentId)){
    expandedComments.delete(commentId);
  } else {
    expandedComments.add(commentId);
  }
  renderCommentsList();
}

/* --- إرسال تعليق جديد --- */
async function submitComment(){
  const isAnon = document.getElementById('anon-check').checked;
  const nameInput = document.getElementById('commenter-name');
  const textInput = document.getElementById('comment-text');

  const name = isAnon ? "زائر مجهول" : nameInput.value.trim();
  const message = textInput.value.trim();

  if(!isAnon && name === ""){
    alert("من فضلك اكتب اسمك، أو اختر إرسال كمجهول");
    return;
  }
  if(message === ""){
    alert("اكتب تعليقك الأول");
    return;
  }

  try{
    const { error } = await commentsSupabase
      .from('comments')
      .insert({ name: name, message: message });

    if(error) throw error;

    textInput.value = "";
    await loadComments();
    markCommentsAsSeen();

  } catch(err){
    alert("حصل خطأ: " + (err.message || JSON.stringify(err)));
  }
}

/* --- إرسال رد --- */
async function submitReply(commentId){
  const input = document.getElementById('reply-input-' + commentId);
  const nameInput = document.getElementById('reply-name-' + commentId);
  const isAnon = document.getElementById('reply-anon-' + commentId).checked;

  const message = input.value.trim();
  const name = isAnon ? "زائر مجهول" : nameInput.value.trim();

  if(!isAnon && name === ""){
    alert("اكتب اسمك أو اختر إرسال كمجهول");
    return;
  }
  if(message === ""){
    alert("اكتب ردك الأول");
    return;
  }

  try{
    const { error } = await commentsSupabase
      .from('comment_replies')
      .insert({ comment_id: commentId, name: name, message: message });

    if(error) throw error;

    input.value = "";
    expandedComments.add(commentId);
    await loadComments();
    markCommentsAsSeen();

  } catch(err){
    alert("حصل خطأ: " + (err.message || JSON.stringify(err)));
  }
}

/* --- حذف تعليق (بكلمة سر) --- */
async function deleteComment(commentId){
  const pass = prompt("أدخل كلمة السر للحذف:");
  if(pass === null) return;

  try{
    const { error } = await commentsSupabase.rpc('delete_comment', {
      target_id: commentId,
      secret: pass
    });

    if(error) throw error;

    await loadComments();
    markCommentsAsSeen();

  } catch(err){
    alert("كلمة السر غلط أو حصل خطأ");
  }
}

/* --- حذف رد (بكلمة سر) --- */
async function deleteReply(replyId, parentCommentId){
  const pass = prompt("أدخل كلمة السر للحذف:");
  if(pass === null) return;

  try{
    const { error } = await commentsSupabase.rpc('delete_reply', {
      target_id: replyId,
      secret: pass
    });

    if(error) throw error;

    await loadComments();
    markCommentsAsSeen();

  } catch(err){
    alert("كلمة السر غلط أو حصل خطأ");
  }
}

/* --- إدارة شعار التعليقات الجديدة --- */
async function updateCommentsBadge(){
  try{
    const { count: commentsCount } = await commentsSupabase
      .from('comments')
      .select('*', { count: 'exact', head: true });

    const { count: repliesCount } = await commentsSupabase
      .from('comment_replies')
      .select('*', { count: 'exact', head: true });

    const total = (commentsCount || 0) + (repliesCount || 0);
    const lastSeen = parseInt(localStorage.getItem('commentsLastSeen') || '0');

    const badge = document.getElementById('comments-badge');
    const newCount = total - lastSeen;

    if(newCount > 0){
      badge.style.display = 'flex';
      badge.textContent = newCount > 99 ? '99+' : newCount;
    } else {
      badge.style.display = 'none';
    }

  } catch(err){
    console.error('خطأ في تحديث شعار التعليقات:', err);
  }
}

async function markCommentsAsSeen(){
  try{
    const { count: commentsCount } = await commentsSupabase
      .from('comments')
      .select('*', { count: 'exact', head: true });

    const { count: repliesCount } = await commentsSupabase
      .from('comment_replies')
      .select('*', { count: 'exact', head: true });

    const total = (commentsCount || 0) + (repliesCount || 0);
    localStorage.setItem('commentsLastSeen', total);

    document.getElementById('comments-badge').style.display = 'none';

  } catch(err){
    console.error('خطأ:', err);
  }
}

/* تشغيل الشعار أول ما الصفحة تفتح، وتحديثه كل 20 ثانية */
updateCommentsBadge();
setInterval(updateCommentsBadge, 20000);

</script>
